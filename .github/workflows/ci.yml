name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CP4_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      HOURLY_EVIDENCE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sc_hourly_evidence_test_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create isolated hourly evidence test database
        env:
          PGPASSWORD: postgres
        run: createdb --host=127.0.0.1 --port=5432 --username=postgres sc_hourly_evidence_test_ci

      - name: Run test suite
        run: npm test

      - name: Remove isolated hourly evidence test database
        if: always()
        env:
          PGPASSWORD: postgres
        run: dropdb --if-exists --host=127.0.0.1 --port=5432 --username=postgres sc_hourly_evidence_test_ci
